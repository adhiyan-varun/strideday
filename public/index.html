<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>strideday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ice:#EAF1F5;--card:#FFFFFF;--ink:#12233B;--mute:#5B6B80;--blue:#1F4FBF;--onblue:#FFFFFF;--red:#D63B2F;--line:#C9D6E0;--ok:#1F8A5B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ice:#0E1A2B;--card:#16263D;--ink:#E8F0F7;--mute:#92A3B8;--blue:#6F97FF;--onblue:#0E1A2B;--red:#FF6B5E;--line:#2A3E5A;--ok:#4CC38A;color-scheme:dark}}
:root[data-theme="dark"]{--ice:#0E1A2B;--card:#16263D;--ink:#E8F0F7;--mute:#92A3B8;--blue:#6F97FF;--onblue:#0E1A2B;--red:#FF6B5E;--line:#2A3E5A;--ok:#4CC38A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--ice);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{padding:18px 0 10px;border-bottom:3px solid var(--red);display:flex;align-items:baseline;justify-content:space-between}
h1{font:700 40px/1 "Barlow Condensed",sans-serif;margin:0;letter-spacing:.5px}
.date{color:var(--mute);font-weight:500}
nav{display:flex;gap:6px;margin:14px 0}
nav button{flex:1}
button{font:600 15px Barlow,sans-serif;min-height:44px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri,nav button.on{background:var(--blue);color:var(--onblue);border-color:var(--blue)}
button.danger{color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sum{margin:6px 0 12px;color:var(--mute)}.sum b{color:var(--ink);font:700 22px "Barlow Condensed",sans-serif}
.row{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row.done{border-left-color:var(--blue)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
h3{margin:0;font-size:18px}
.t{color:var(--mute);font-size:14px}
.num{font:700 46px/1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.row.done .num{color:var(--blue)}
.ctl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl button{flex:1;min-width:64px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:16px}
summary{cursor:pointer;font-weight:600;min-height:32px}
.ed{display:flex;gap:8px;align-items:center;margin:8px 0}
.ed span{flex:1}
input,select{font:500 16px Barlow,sans-serif;min-height:44px;padding:0 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--ice);color:var(--ink);min-width:0}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.add input[type=text]{flex:2 1 140px}.add input[type=number]{flex:1 1 90px}.add select{flex:1 1 90px}
.clock{font:700 88px/1 "Barlow Condensed",sans-serif;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0 0}
.cur{text-align:center;color:var(--mute);margin-bottom:12px}
.bigbtns{display:flex;gap:8px;margin:10px 0}
.bigbtns button{flex:1;min-height:60px;font-size:18px}
.len{display:flex;align-items:center;gap:10px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:13px}
.lap{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lap.best{color:var(--blue);font-weight:600}
.empty{color:var(--mute);padding:16px 0}
h2{font:700 24px "Barlow Condensed",sans-serif;margin:22px 0 8px}
.week{display:flex;gap:6px;align-items:flex-end;height:96px}
.col{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.bar{background:var(--line);border-radius:4px 4px 0 0;min-height:3px}
.bar.full{background:var(--blue)}
.col .h{height:72px;display:flex;align-items:flex-end}.col .h .bar{width:100%}
.tot{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px solid var(--line)}
@media (max-width:380px){.clock{font-size:72px}.num{font-size:40px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>strideday</h1><span class="date" id="date"></span></header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<script>
const KEY='strideday:v1';
const defaults={ex:[
{id:'e1',name:'Skipping',type:'time',target:300},
{id:'e2',name:'Squats',type:'count',target:30},
{id:'e3',name:'Lunges',type:'count',target:20},
{id:'e4',name:'Plank',type:'time',target:60},
{id:'e5',name:'Single-leg balance',type:'time',target:30}],
log:{},laps:[],len:200};
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
S=Object.assign(JSON.parse(JSON.stringify(defaults)),S||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dk=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtS=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const fmtMs=ms=>{const t=Math.floor(ms/100);return Math.floor(t/600)+':'+String(Math.floor(t/10)%60).padStart(2,'0')+'.'+(t%10)};
let tab='today',ed=false,run=null;
const L={run:false,t0:0,base:0,marks:[]};
const val=(id,k)=>((S.log[k||dk()]||{})[id])||0;
function setVal(id,v){const k=dk();S.log[k]=S.log[k]||{};S.log[k][id]=Math.max(0,Math.floor(v));save()}
const cur=id=>run&&run.id===id?run.base+Math.floor((Date.now()-run.t0)/1000):val(id);
const isDone=e=>cur(e.id)>=e.target;
function pct(k){if(!S.ex.length)return 0;return S.ex.filter(e=>val(e.id,k)>=e.target).length/S.ex.length}
function stopEx(){if(run){setVal(run.id,cur(run.id));run=null}}
function toggle(id){const was=run&&run.id===id;stopEx();if(!was)run={id,t0:Date.now(),base:val(id)};wake()}
function adj(id,n){if(run&&run.id===id){run.base=Math.max(0,run.base+n)}else setVal(id,val(id)+n)}
let wl=null;
async function wake(){const need=run||L.run;try{if(need&&!wl){wl=await navigator.wakeLock.request('screen')}else if(!need&&wl){await wl.release();wl=null}}catch(e){wl=null}}
const elapsed=()=>L.base+(L.run?performance.now()-L.t0:0);
const splits=()=>L.marks.map((m,i)=>m-(i?L.marks[i-1]:0));
function viewToday(){
  const n=S.ex.filter(isDone).length;
  let h=`<p class="sum"><b>${n}</b> of ${S.ex.length} done today</p>`;
  if(!S.ex.length)h+=`<p class="empty">No exercises yet. Add one under Edit routine.</p>`;
  h+=S.ex.map(e=>{
    const v=cur(e.id),d=v>=e.target,time=e.type==='time';
    const tgt=time?fmtS(e.target):e.target+' reps';
    const ctl=time
      ?`<button class="pri" data-a="tg" data-id="${e.id}">${run&&run.id===e.id?'Stop':'Start'}</button><button data-a="adj" data-id="${e.id}" data-n="-10">−10s</button><button data-a="adj" data-id="${e.id}" data-n="10">+10s</button>`
      :`<button data-a="adj" data-id="${e.id}" data-n="-1">−1</button><button class="pri" data-a="adj" data-id="${e.id}" data-n="1">+1</button><button data-a="adj" data-id="${e.id}" data-n="5">+5</button><button data-a="adj" data-id="${e.id}" data-n="10">+10</button>`;
    return `<section class="row${d?' done':''}" id="r-${e.id}"><div class="hd"><div><h3>${esc(e.name)}</h3><span class="t">Target ${tgt}</span></div><div class="num" id="v-${e.id}">${time?fmtS(v):v}</div></div><div class="ctl">${ctl}</div></section>`}).join('');
  h+=`<details ${ed?'open':''} ontoggle="ed=this.open"><summary>Edit routine</summary>`+
    S.ex.map(e=>`<div class="ed"><span>${esc(e.name)} · ${e.type==='time'?fmtS(e.target):e.target+' reps'}</span><button class="danger" data-a="rm" data-id="${e.id}">Remove</button></div>`).join('')+
    `<div class="add"><input type="text" id="nn" placeholder="Exercise name" aria-label="Exercise name"><select id="nt" aria-label="Type"><option value="count">Reps</option><option value="time">Timed</option></select><input type="number" id="nv" min="1" placeholder="Target (reps or seconds)" aria-label="Target"><button class="pri" data-a="add">Add exercise</button></div></details>`;
  return h;
}
function viewLaps(){
  const sp=splits(),n=sp.length,total=n?L.marks[n-1]:0,dist=n*S.len;
  const best=n?Math.min(...sp):0,avg=n?total/n:0,kmh=n&&total?(dist/1000)/(total/3600000):0;
  const idle=!L.run&&elapsed()===0,paused=!L.run&&elapsed()>0;
  let btn;
  if(idle)btn=`<button class="pri" data-a="lstart">Start</button>`;
  else if(L.run)btn=`<button class="pri" data-a="llap">Lap</button><button data-a="lstop">Stop</button>`;
  else btn=`<button class="pri" data-a="lstart">Resume</button><button data-a="lsave">Save session</button><button data-a="lreset">Reset</button>`;
  let h=`<div class="len"><label for="len">Track length (m)</label><input type="number" id="len" min="1" value="${S.len}" style="width:100px" onchange="S.len=Math.max(1,+this.value||1);save();render()"></div>
  <div class="clock" id="clock">${fmtMs(elapsed())}</div><div class="cur" id="curlap">Current lap ${fmtMs(elapsed()-(n?L.marks[n-1]:0))}</div>
  <div class="bigbtns">${btn}</div>
  <div class="stats"><div class="stat"><b>${n}</b><span>Laps</span></div><div class="stat"><b>${dist>=1000?(dist/1000).toFixed(2)+' km':dist+' m'}</b><span>Distance</span></div><div class="stat"><b>${n?fmtMs(best):'–'}</b><span>Best lap</span></div><div class="stat"><b>${n?fmtMs(avg):'–'}</b><span>Average lap</span></div><div class="stat"><b>${n?kmh.toFixed(1)+' km/h':'–'}</b><span>Average speed</span></div></div>`;
  if(!n)h+=`<p class="empty">No laps yet. Press Start, then tap Lap each time you finish a round.</p>`;
  else h+=sp.map((s,i)=>({s,i})).reverse().map(o=>`<div class="lap${o.s===best?' best':''}"><span>Lap ${o.i+1}${o.s===best?' · best':''}</span><span>${fmtMs(o.s)}</span><span>${fmtMs(L.marks[o.i])}</span></div>`).join('');
  return h;
}
function viewProgress(){
  let streak=0,d=new Date();
  if(pct(dk(d))<1)d.setDate(d.getDate()-1);
  while(pct(dk(d))===1){streak++;d.setDate(d.getDate()-1)}
  const days=[];for(let i=6;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);days.push(x)}
  let h=`<p class="sum"><b>${streak}</b> ${streak===1?'day':'days'} in a row with every exercise done</p><h2>Last 7 days</h2><div class="week">`+
    days.map(x=>{const p=pct(dk(x));return `<div class="col"><div class="h"><div class="bar${p===1?' full':''}" style="height:${Math.round(p*100)}%"></div></div>${x.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3)}</div>`}).join('')+`</div><h2>This week’s totals</h2>`;
  h+=S.ex.map(e=>{const t=days.reduce((a,x)=>a+val(e.id,dk(x)),0);return `<div class="tot"><span>${esc(e.name)}</span><b>${e.type==='time'?fmtS(t):t+' reps'}</b></div>`}).join('')||`<p class="empty">No exercises yet.</p>`;
  h+=`<h2>Lap sessions</h2>`;
  if(!S.laps.length)h+=`<p class="empty">No saved sessions yet. Finish a run and press Save session.</p>`;
  else h+=S.laps.slice(0,10).map(s=>{const t=s.splits.reduce((a,b)=>a+b,0),dist=s.splits.length*s.len;return `<div class="lap"><span>${s.d}</span><span>${s.splits.length} × ${s.len} m</span><span>best ${fmtMs(Math.min(...s.splits))}</span><span>${((dist/1000)/(t/3600000)).toFixed(1)} km/h</span></div>`}).join('');
  return h;
}
function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'short'});
  document.getElementById('nav').innerHTML=[['today','Today'],['laps','Laps'],['prog','Progress']].map(t=>`<button class="${tab===t[0]?'on':''}" data-a="tab" data-t="${t[0]}">${t[1]}</button>`).join('');
  document.getElementById('main').innerHTML=tab==='today'?viewToday():tab==='laps'?viewLaps():viewProgress();
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(a==='tab')tab=b.dataset.t;
  else if(a==='adj')adj(id,+b.dataset.n);
  else if(a==='tg')toggle(id);
  else if(a==='rm'){if(run&&run.id===id)run=null;S.ex=S.ex.filter(e=>e.id!==id);save()}
  else if(a==='add'){const name=document.getElementById('nn').value.trim();if(!name)return;const type=document.getElementById('nt').value;S.ex.push({id:'e'+Date.now(),name,type,target:Math.max(1,parseInt(document.getElementById('nv').value)||(type==='time'?60:10))});save()}
  else if(a==='lstart'){L.run=true;L.t0=performance.now();wake()}
  else if(a==='llap'){L.marks.push(elapsed())}
  else if(a==='lstop'){L.base=elapsed();L.run=false;wake()}
  else if(a==='lreset'){L.run=false;L.base=0;L.marks=[]}
  else if(a==='lsave'){if(L.marks.length){S.laps.unshift({d:dk(),len:S.len,splits:splits()});save();L.base=0;L.marks=[]}}
  render();
});
setInterval(()=>{
  if(run&&tab==='today'){
    const v=cur(run.id);setVal(run.id,v);
    const e=S.ex.find(x=>x.id===run.id);
    const el=document.getElementById('v-'+run.id);if(el)el.textContent=fmtS(v);
    const r=document.getElementById('r-'+run.id);if(r&&e)r.classList.toggle('done',v>=e.target);
  }else if(run){setVal(run.id,cur(run.id))}
  if(L.run&&tab==='laps'){
    const c=document.getElementById('clock');if(c)c.textContent=fmtMs(elapsed());
    const n=L.marks.length,l=document.getElementById('curlap');if(l)l.textContent='Current lap '+fmtMs(elapsed()-(n?L.marks[n-1]:0));
  }
},200);
render();
</script>
</body>
</html>
